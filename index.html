<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker | Track Your Spending</title>
    <meta
      name="description"
      content="A simple, responsive expense tracker built with HTML, CSS, and JavaScript. Add, categorize, and delete expenses with a running total, saved in your browser."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Expense Tracker</h1>

      <!-- Form -->
      <form id="expense-form">
        <input
          type="text"
          id="description"
          placeholder="Description"
          aria-label="Expense description"
          required
        />
        <input
          type="number"
          id="amount"
          placeholder="Amount"
          aria-label="Expense amount"
          min="0.01"
          step="0.01"
          required
        />

        <input
          type="text"
          id="category"
          placeholder="Category"
          aria-label="Expense category"
        />

        <button type="submit">Submit</button>
      </form>

      <h2 id="total">Total: $0.00</h2>

      <!-- Expense List -->
      <ul id="expense-list"></ul>
    </div>
